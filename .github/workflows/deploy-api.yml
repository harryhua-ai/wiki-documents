name: Deploy API

on:
  push:
    branches:
      - main
    paths:
      - 'api/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: 🚀 Deploy API Service
    runs-on: ubuntu-latest

    steps:
      # 0. 显示部署信息
      - name: 0. Display deployment info
        run: |
          echo "=========================================="
          echo "🚀 开始部署 API 服务"
          echo "👤 触发用户: ${{ github.actor }}"
          echo "🔖 提交 SHA: ${{ github.sha }}"
          echo "📅 触发时间: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "=========================================="

      # 1. 检出源码
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      # 2. 安装 Node.js
      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. 缓存 node_modules
      - name: 3. Cache API dependencies
        uses: actions/cache@v4
        with:
          path: api/node_modules
          key: ${{ runner.os }}-node-api-${{ hashFiles('api/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-api-

      # 4. 安装 API 依赖
      - name: 4. Install API dependencies
        run: |
          echo "📦 安装 API 依赖..."
          cd api && npm ci --production=false

      # 5. 构建 API
      - name: 5. Build API
        run: |
          echo "🔨 构建 API..."
          cd api && npm run build

      # 6. 创建部署包
      - name: 6. Create deployment package
        run: |
          echo "📦 创建部署包..."
          cd api
          # 只打包必要的文件，排除 node_modules 和测试文件
          tar -czf ../wiki-api-deploy.tar.gz \
            --exclude='*.test.ts' \
            --exclude='__tests__' \
            --exclude='node_modules' \
            --exclude='*.log' \
            dist/ \
            src/ \
            scripts/ \
            package.json \
            package-lock.json \
            tsconfig.json \
            .env.production.example \
            pm2.config.js

          echo "✅ 部署包创建完成"

      # 7. 部署到服务器
      - name: 7. Deploy API via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: wiki-api-deploy.tar.gz
          target: ${{ secrets.API_DEPLOY_PATH }}
          strip_components: 1
          run: |
            echo "📦 上传 API 代码到服务器..."

            # 创建必要的目录
            mkdir -p ${{ secrets.API_DEPLOY_PATH }}/logs
            mkdir -p ${{ secrets.API_DEPLOY_PATH }}/dist

            # 解压部署包
            tar -xzf wiki-api-deploy.tar.gz -C ${{ secrets.API_DEPLOY_PATH }}

            # 清理解压包
            rm -f wiki-api-deploy.tar.gz

            # 验证 .env.production 文件
            if [ ! -f ${{ secrets.API_DEPLOY_PATH }}/.env.production ]; then
              echo "⚠️  警告: .env.production 文件不存在"
              echo "正在从 .env.production.example 创建..."
              cp ${{ secrets.API_DEPLOY_PATH }}/.env.production.example ${{ secrets.API_DEPLOY_PATH }}/.env.production
              echo "❌ 请在服务器上配置以下环境变量:"
              echo "   - DEEPSEEK_API_KEY"
              echo "   - SILICONFLOW_API_KEY (或其他 embedding provider)"
              echo "   - QDRANT_URL 或 VECTOR_DB_PATH"
              echo ""
              echo "配置完成后，请手动重启 API 服务:"
              echo "   ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} 'cd ${{ secrets.API_DEPLOY_PATH }} && pm2 restart wiki-api'"
              exit 1
            fi

            # 检查是否有占位符配置
            if grep -q "change-me-in-production\|your_api_key_here\|YOUR_API_KEY\|YOUR_DEEPSEEK\|YOUR_SILICONFLOW" ${{ secrets.API_DEPLOY_PATH }}/.env.production 2>/dev/null; then
              echo "❌ 错误: .env.production 包含占位符配置"
              echo "请配置真实的环境变量后重新部署"
              exit 1
            fi

            # 安装/更新生产依赖
            echo "📦 安装生产依赖..."
            cd ${{ secrets.API_DEPLOY_PATH }}
            npm ci --production

            # 重启服务（使用 zero-downtime 方式）
            echo "🔄 重启 API 服务..."
            if pm2 list | grep -q "wiki-api"; then
              echo "使用 PM2 reload (zero-downtime)..."
              pm2 reload pm2.config.js --update-env || pm2 restart wiki-api
            else
              echo "启动新的 PM2 进程..."
              pm2 start pm2.config.js --update-env
            fi

            echo "✅ API 部署完成！"
            pm2 status wiki-api

      # 8. 健康检查
      - name: 8. Health check
        run: |
          echo "🏥 执行健康检查..."
          sleep 5

          # 尝试连接 API
          MAX_ATTEMPTS=6
          ATTEMPT=1

          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "健康检查尝试 $ATTEMPT/$MAX_ATTEMPTS..."

            HEALTH_CHECK=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
              ${{ secrets.API_HEALTH_URL }} || echo "")

            if [ "$HEALTH_CHECK" = "200" ]; then
              echo "✅ API 健康检查通过"
              echo ""
              echo "🎉 API 服务部署成功！"
              echo "📍 API 地址: ${{ secrets.API_HEALTH_URL }}"
              exit 0
            fi

            ATTEMPT=$((ATTEMPT + 1))
            sleep 3
          done

          echo "❌ API 健康检查失败"
          echo "请检查服务器日志: ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} 'pm2 logs wiki-api --lines 50'"
          exit 1
